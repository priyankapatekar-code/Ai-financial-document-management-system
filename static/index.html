<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Documents</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f5f7;
    --card: #fff;
    --control: #f4f4f7;
    --ink: #1d1d1f;
    --muted: #5c606a;
    --line: #e1e2e8;
    --blue: #0066cc;
    --button: #006edb;
    --button-hover: #005cbb;
    --wash: #e8f2ff;
    --glow: #d9e9ff;
    --success: #176139;
    --error: #a52b24;
    --shadow: 0 18px 50px -30px rgb(37 48 79 / .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #141417;
      --card: #222226;
      --control: #2c2c31;
      --ink: #f5f5f7;
      --muted: #b5b5c1;
      --line: #3c3c44;
      --blue: #80bcff;
      --button-hover: #1175dd;
      --wash: #202f46;
      --glow: #202c43;
      --success: #79d7a8;
      --error: #ffa29a;
      --shadow: 0 18px 50px -30px rgb(0 0 0 / .65);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse 52rem 32rem at 50% 0, var(--glow), transparent), var(--page);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 1;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    background: color-mix(in srgb, var(--card) 82%, transparent);
    backdrop-filter: blur(20px);
  }
  .topbar-inner {
    max-width: 74rem;
    min-height: 4rem;
    margin: auto;
    padding: .65rem clamp(1rem, 4vw, 2.5rem);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem 1.5rem;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: .7rem;
    margin: 0;
    font-size: 1rem;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  .document-mark {
    display: grid;
    place-items: center;
    flex: none;
    width: 2.1rem;
    height: 2.1rem;
    border-radius: .65rem;
    background: linear-gradient(155deg, #368dff, #005cbd);
    color: white;
  }
  .document-mark::before {
    content: "";
    width: .7rem;
    height: .9rem;
    border: 1.5px solid currentColor;
    border-radius: .18rem;
    background: linear-gradient(currentColor, currentColor) center 43% / 55% 1px no-repeat,
                linear-gradient(currentColor, currentColor) center 67% / 55% 1px no-repeat;
  }
  .who {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: .75rem;
    color: var(--muted);
    font-size: .875rem;
  }
  #whoText { overflow-wrap: anywhere; }
  .who button { flex: none; }
  main {
    max-width: 74rem;
    margin: auto;
    padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 2.5rem) 4rem;
  }
  .card {
    min-width: 0;
    padding: clamp(1.25rem, 3vw, 2rem);
    border: 1px solid var(--line);
    border-radius: 1.5rem;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 .85rem;
    font-size: clamp(1.35rem, 2.5vw, 1.75rem);
    line-height: 1.15;
    letter-spacing: -.035em;
  }
  #authCard {
    max-width: 29rem;
    margin: clamp(0rem, 6vw, 4.5rem) auto 0;
    padding: clamp(1.25rem, 6vw, 2.75rem);
  }
  #authCard h2 {
    margin-bottom: 1.5rem;
    font-size: clamp(1.85rem, 5vw, 2.6rem);
    text-align: center;
  }
  #appArea { display: grid; gap: 1.25rem; align-items: start; }
  #askCard {
    background: linear-gradient(120deg, var(--wash), var(--card) 70%);
  }
  #askCard p { margin: -.35rem 0 1rem; }
  @media (min-width: 58rem) {
    #appArea:has(#uploadCard:not(.hidden)) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); }
    #askCard { grid-column: 1 / -1; }
  }
  label {
    display: block;
    margin: .9rem 0 .35rem;
    color: var(--muted);
    font-size: .875rem;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    min-width: 0;
    padding: .65rem .8rem;
    border: 1px solid var(--line);
    border-radius: .75rem;
    background-color: var(--control);
    color: var(--ink);
    font: inherit;
  }
  input::placeholder { color: var(--muted); }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }
  input[type="file"] { font-size: .875rem; }
  input::file-selector-button {
    margin-inline-end: .55rem;
    padding: .3rem .65rem;
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button {
    min-height: 2.75rem;
    padding: .55rem 1.15rem;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--button);
    color: white;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--button-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  button.ghost, button.danger {
    min-height: 2.25rem;
    padding: .35rem .75rem;
    background: transparent;
    font-size: .875rem;
  }
  button.ghost { color: var(--blue); border-color: var(--line); }
  button.ghost:hover { background: var(--wash); }
  button.danger { color: var(--error); }
  button.danger:hover { background: color-mix(in srgb, var(--error) 10%, transparent); }
  .tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .2rem;
    padding: .25rem;
    border-radius: .875rem;
    background: var(--control);
  }
  .tabs button {
    min-height: 2.5rem;
    padding: .4rem .25rem;
    border-radius: .65rem;
    background: transparent;
    color: var(--muted);
    font-size: .875rem;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active {
    border-color: var(--line);
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 3px rgb(0 0 0 / .1);
  }
  .form-actions { margin-top: 1.25rem; }
  #authBtn { width: 100%; }
  #askForm { display: flex; flex-wrap: wrap; gap: .65rem; }
  #question { flex: 1 1 14rem; background: var(--card); }
  #askBtn { min-width: 5.5rem; }
  .msg {
    display: none;
    margin-top: .85rem;
    padding: .65rem .8rem;
    border-radius: .75rem;
    overflow-wrap: anywhere;
    font-size: .875rem;
  }
  .msg.ok { display: block; color: var(--success); background: color-mix(in srgb, var(--success) 10%, transparent); }
  .msg.err { display: block; color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); }
  .answer {
    display: none;
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: .875rem;
    background: var(--card);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th, td { padding: .75rem .65rem; border-bottom: 1px solid var(--line); text-align: left; }
  th { background: var(--control); color: var(--muted); font-weight: 600; }
  th:first-child { border-start-start-radius: .65rem; }
  th:last-child { border-start-end-radius: .65rem; }
  td:first-child { min-width: 8rem; overflow-wrap: anywhere; font-weight: 600; }
  td:nth-child(4) { white-space: nowrap; }
  td:last-child { text-align: right; }
  tbody tr:last-child td { border-bottom: 0; }
  #noDocs {
    margin: 0;
    padding: 2rem 1rem;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  .muted { color: var(--muted); }
  .hidden, #appArea.hidden { display: none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand"><span class="document-mark" aria-hidden="true"></span>Financial Documents</h1>
    <div class="who hidden" id="who"><span id="whoText"></span><button class="ghost" id="logout">Log out</button></div>
  </div>
</header>

<main>
  <!-- Login / Register -->
  <section class="card" id="authCard" aria-labelledby="authHeading">
    <h2 id="authHeading">Welcome</h2>
    <div class="tabs" role="group" aria-label="Account access">
      <button id="tabLogin" class="active" type="button" aria-pressed="true">Log in</button>
      <button id="tabRegister" type="button" aria-pressed="false">Create account</button>
    </div>
    <form id="authForm">
      <div id="nameWrap" class="hidden">
        <label for="username">Name</label>
        <input id="username" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <div id="roleWrap" class="hidden">
        <label for="role">I am a…</label>
        <select id="role">
          <option value="client">Client</option>
          <option value="financial_analyst">Financial analyst</option>
          <option value="auditor">Auditor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-actions"><button type="submit" id="authBtn">Log in</button></div>
      <div class="msg" id="authMsg" role="status"></div>
    </form>
  </section>

  <!-- App -->
  <div id="appArea" class="hidden">
    <section class="card" id="askCard">
      <h2>Ask a question</h2>
      <p class="muted">Ask about your uploaded documents and get an AI answer.</p>
      <form id="askForm">
        <input id="question" aria-label="Question" placeholder="e.g. What was the total revenue?" required>
        <button type="submit" id="askBtn">Ask</button>
      </form>
      <div class="answer" id="answer" role="status"></div>
      <div class="msg" id="askMsg" role="status"></div>
    </section>

    <section class="card hidden" id="uploadCard">
      <h2>Upload a PDF</h2>
      <form id="uploadForm">
        <label for="title">Title</label>
        <input id="title" required>
        <label for="company">Company</label>
        <input id="company" required>
        <label for="dtype">Type</label>
        <select id="dtype">
          <option>Annual report</option><option>Balance sheet</option><option>Invoice</option>
          <option>Audit report</option><option>Other</option>
        </select>
        <label for="file">PDF file</label>
        <input id="file" type="file" accept="application/pdf,.pdf" required>
        <div class="form-actions"><button type="submit" id="uploadBtn">Upload</button></div>
        <div class="msg" id="uploadMsg" role="status"></div>
      </form>
    </section>

    <section class="card">
      <h2 id="docsHeading">Documents</h2>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="docsHeading">
        <table>
          <thead><tr><th>Title</th><th>Company</th><th>Type</th><th>Date</th><th></th></tr></thead>
          <tbody id="docs"></tbody>
        </table>
      </div>
      <p class="muted" id="noDocs">No documents yet.</p>
      <div class="msg" id="docsMsg" role="status"></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let token = null, role = null, email = null;
try { token = localStorage.getItem('token'); } catch(e){}

function show(el, text, kind){ el.textContent = text; el.className = 'msg ' + kind; }
function clear(el){ el.className = 'msg'; el.textContent = ''; }

function parseToken(t){
  try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch(e){ return null; }
}

async function api(path, opts = {}){
  opts.headers = Object.assign({}, opts.headers, token ? {Authorization: 'Bearer ' + token} : {});
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch(e){}
  if (res.status === 401 && token && path !== '/auth/login') { logout(); throw new Error('Session expired, please log in again.'); }
  if (!res.ok) {
    let d = data && data.detail;
    if (Array.isArray(d)) d = d.map(x => x.msg).join(', ');
    throw new Error(d || 'Something went wrong (' + res.status + ')');
  }
  return data;
}

// ---- auth tabs
let mode = 'login';
function setMode(m){
  mode = m;
  $('tabLogin').classList.toggle('active', m === 'login');
  $('tabRegister').classList.toggle('active', m === 'register');
  $('tabLogin').setAttribute('aria-pressed', m === 'login');
  $('tabRegister').setAttribute('aria-pressed', m === 'register');
  $('authHeading').textContent = m === 'login' ? 'Welcome' : 'Create an account';
  $('nameWrap').classList.toggle('hidden', m === 'login');
  $('roleWrap').classList.toggle('hidden', m === 'login');
  $('authBtn').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  clear($('authMsg'));
}
$('tabLogin').onclick = () => setMode('login');
$('tabRegister').onclick = () => setMode('register');

async function doLogin(emailVal, pass){
  const data = await api('/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: emailVal, password: pass})
  });
  if (!data.access_token) throw new Error(data.message || 'Login failed');
  token = data.access_token;
  try { localStorage.setItem('token', token); } catch(e){}
  enter();
}

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('authBtn'); btn.disabled = true; clear($('authMsg'));
  try {
    const emailVal = $('email').value.trim(), pass = $('password').value;
    if (mode === 'register') {
      await api('/auth/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: $('username').value.trim() || emailVal, email: emailVal,
                              password: pass, role: $('role').value})
      });
    }
    await doLogin(emailVal, pass);
  } catch(err){
    show($('authMsg'), err.message.includes('500') ? 'Could not complete that. The email may already be registered.' : err.message, 'err');
  } finally { btn.disabled = false; }
};

function logout(){
  token = null;
  try { localStorage.removeItem('token'); } catch(e){}
  $('authCard').classList.remove('hidden');
  $('appArea').classList.add('hidden');
  $('who').classList.add('hidden');
  $('password').value = '';
}
$('logout').onclick = logout;

function enter(){
  const p = token && parseToken(token);
  if (!p) { logout(); return; }
  role = p.role; email = p.email;
  $('authCard').classList.add('hidden');
  $('appArea').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('whoText').textContent = email + ' · ' + role.replace('_', ' ');
  $('uploadCard').classList.toggle('hidden', role !== 'admin');
  $('askCard').classList.toggle('hidden', !['admin','financial_analyst','auditor'].includes(role));
  loadDocs();
}

// ---- documents
async function loadDocs(){
  clear($('docsMsg'));
  try {
    const {documents} = await api('/documents');
    const body = $('docs'); body.innerHTML = '';
    $('noDocs').classList.toggle('hidden', documents.length > 0);
    for (const d of documents) {            // id, title, company, type, uploaded_by, created_at, file
      const tr = document.createElement('tr');
      [d[1], d[2], d[3], (d[5] || '').slice(0, 10)].forEach(v => {
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      const td = document.createElement('td');
      if (role === 'admin') {
        const b = document.createElement('button'); b.className = 'danger'; b.textContent = 'Delete';
        b.onclick = async () => {
          if (!confirm('Delete "' + d[1] + '"?')) return;
          try { await api('/documents/' + d[0], {method: 'DELETE'}); loadDocs(); }
          catch(err){ show($('docsMsg'), err.message, 'err'); }
        };
        td.appendChild(b);
      }
      tr.appendChild(td); body.appendChild(tr);
    }
  } catch(err){ show($('docsMsg'), err.message, 'err'); }
}

$('uploadForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('uploadBtn'); btn.disabled = true; btn.textContent = 'Uploading…'; clear($('uploadMsg'));
  try {
    const q = new URLSearchParams({title: $('title').value, company_name: $('company').value,
                                   document_type: $('dtype').value});
    const fd = new FormData(); fd.append('file', $('file').files[0]);
    const r = await api('/documents/upload?' + q, {method: 'POST', body: fd});
    show($('uploadMsg'), 'Uploaded "' + r.filename + '" (' + r.chunks_created + ' sections indexed).', 'ok');
    $('uploadForm').reset(); loadDocs();
  } catch(err){ show($('uploadMsg'), err.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = 'Upload'; }
};

$('askForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('askBtn'); btn.disabled = true; btn.textContent = 'Thinking…';
  clear($('askMsg')); $('answer').style.display = 'none';
  try {
    const r = await api('/documents/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: $('question').value})
    });
    $('answer').textContent = r.answer; $('answer').style.display = 'block';
  } catch(err){ show($('askMsg'), err.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = 'Ask'; }
};

setMode('login');
if (token) enter();
</script>
</body>
</html>
